included:
  - Projects
  - Tests
excluded:
  - .build
  - .tuist
  - Tuist/Derived
  - .specify
opt_in_rules:
  - attributes
  - sorted_imports
  - explicit_init
  - closure_body_length
  - empty_count
  - empty_string
  - fatal_error_message
  - force_unwrapping
  - function_body_length
  - implicitly_unwrapped_optional
  - large_tuple
  - multiline_parameters
  - unused_import
  - yoda_condition
disabled_rules:
  - trailing_whitespace
  - todo
  - identifier_name
  - trailing_comma
line_length:
  warning: 140
  error: 200
type_body_length:
  warning: 200
  error: 300
file_length:
  warning: 400
  error: 500
function_body_length:
  warning: 40
  error: 60
cyclomatic_complexity:
  warning: 8
  error: 12
nesting:
  type_level:
    warning: 2
    error: 3
reporter: "xcode"
